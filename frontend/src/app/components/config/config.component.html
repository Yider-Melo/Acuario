<div class="config-card">
  <h2>Configuración de rangos</h2>
  <form (ngSubmit)="saveConfig()" class="config-form">
    <div class="range-grid">
      <label>
        Temperatura mínima
        <input type="number" step="0.1" [(ngModel)]="config.temperature_min" name="temperature_min" required />
      </label>
      <label>
        Temperatura máxima
        <input type="number" step="0.1" [(ngModel)]="config.temperature_max" name="temperature_max" required />
      </label>
      <label>
        pH mínimo
        <input type="number" step="0.1" [(ngModel)]="config.ph_min" name="ph_min" required />
      </label>
      <label>
        pH máximo
        <input type="number" step="0.1" [(ngModel)]="config.ph_max" name="ph_max" required />
      </label>
      <label>
        Nivel agua mínimo
        <input type="number" step="0.1" [(ngModel)]="config.water_level_min" name="water_level_min" required />
      </label>
      <label>
        Nivel agua máximo
        <input type="number" step="0.1" [(ngModel)]="config.water_level_max" name="water_level_max" required />
      </label>
      <label>
        Salinidad mínima
        <input type="number" step="0.1" [(ngModel)]="config.salinity_min" name="salinity_min" required />
      </label>
      <label>
        Salinidad máxima
        <input type="number" step="0.1" [(ngModel)]="config.salinity_max" name="salinity_max" required />
      </label>
    </div>
    <button type="submit">Guardar configuración</button>
  </form>
</div>
